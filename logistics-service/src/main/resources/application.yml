server:
  port: ${LOGISTICS_SERVICE_PORT:8086}

spring:
  application:
    name: ${LOGISTICS_SERVICE_NAME:logistics-service}

  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5433/logistics_db}
    username: ${LOGISTICS_DB_USERNAME:logistics_svc}
    password: ${LOGISTICS_DB_PASSWORD:logistics_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate must not alter it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: logistics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Eureka registration so the API Gateway can discover this service
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

grpc:
  client:
    order-service:
      address: ${ORDER_GRPC_ADDRESS:discovery:///order-service}
      negotiationType: PLAINTEXT

courier-service:
  base-url: ${COURIER_SERVICE_URL:http://localhost:8087}

kafka:
  topic:
    order-events: ${ORDER_EVENTS_TOPIC:kafka-order-events}

assignment:
  system:
    user-id: ${ASSIGNMENT_SYSTEM_USER_ID:00000000-0000-0000-0000-000000000001}
    roles: ${ASSIGNMENT_SYSTEM_ROLES:ADMIN,SUPER_ADMIN}
  retry:
    enabled: ${ASSIGNMENT_RETRY_ENABLED:true}
    fixed-delay-ms: ${ASSIGNMENT_RETRY_FIXED_DELAY_MS:60000}
    delay-seconds: ${ASSIGNMENT_RETRY_DELAY_SECONDS:60}
    max-attempts: ${ASSIGNMENT_RETRY_MAX_ATTEMPTS:5}
    batch-size: ${ASSIGNMENT_RETRY_BATCH_SIZE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    kz.courier.logisticsservice: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
