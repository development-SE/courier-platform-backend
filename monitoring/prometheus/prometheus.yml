global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080", "host.docker.internal:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081", "host.docker.internal:8081"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8084", "host.docker.internal:8084"]

  - job_name: company-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["company-service:8085", "host.docker.internal:8085"]

  - job_name: courier-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["courier-service:8087", "host.docker.internal:8087"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8083", "host.docker.internal:8083"]

  - job_name: logistics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["logistics-service:8086", "host.docker.internal:8086"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8082", "host.docker.internal:8082"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761", "host.docker.internal:8761"]
