server:
  port: ${ORDER_SERVICE_PORT:8083}

# order-service/src/main/resources/application.yml
spring:
  application:
    name: ${ORDER_SERVICE_NAME:order-service}

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${ORDER_DB_USERNAME:order_svc}
    password: ${ORDER_DB_PASSWORD:order_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

  main:
    web-application-type: none

grpc:
  server:
    port: ${ORDER_GRPC_PORT:9095}

# ========== EUREKA CLIENT CONFIGURATION ==========
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      grpc-port: ${grpc.server.port}
      version: "1.0.0"
      zone: "default"

# Actuator (required for Eureka health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    io.grpc: DEBUG
    net.devh.boot.grpc: DEBUG
    root: INFO
    kz.courier.orderservice: DEBUG
    com.netflix.discovery: INFO

# Kafka topics
kafka:
  topic:
    order-events: ${ORDER_EVENTS_TOPIC:kafka-order-events}

notification:
  kafka:
    topic: ${NOTIFICATION_KAFKA_TOPIC:notification-kafka-topic}
