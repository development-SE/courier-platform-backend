server:
  port: ${AUTH_SERVICE_PORT:8081}

# auth-service/src/main/resources/application.yml
spring:
  application:
    name: ${AUTH_SERVICE_NAME:auth-service}
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_DB_USERNAME:auth_svc}
    password: ${AUTH_DB_PASSWORD:auth_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Qyzylorda'
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Qyzylorda
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
  main:
    web-application-type: servlet

notification-kafka-topic: ${NOTIFICATION_KAFKA_TOPIC:notification-kafka-topic}

grpc:
  server:
    port: ${AUTH_GRPC_PORT:9091}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  access-expiry-min: 1440 #later will be15
  refresh-expiry-min: 10080   # 7 days

auth:
  refresh-token:
    pepper: ${AUTH_REFRESH_TOKEN_PEPPER:refresh-token-pepper-change-me}

#notification:
#  grpc:
#    host: notification-service
#    port: 9094

# ========== EUREKA CLIENT CONFIGURATION ==========
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true  # Download registry of other services
    register-with-eureka: true  # Register this service with Eureka
  instance:
    prefer-ip-address: true  # Use IP instead of hostname (important for Docker)
    instance-id: ${spring.application.name}:${random.value}  # Unique instance ID
    lease-renewal-interval-in-seconds: 10  # Heartbeat every 10s
    lease-expiration-duration-in-seconds: 30  # Eureka removes if no heartbeat for 30s
    metadata-map:
      # Custom metadata for service discovery
      grpc-port: ${grpc.server.port}  # ← API Gateway can read this!
      version: "1.0.0"
      zone: "default"

# Actuator (required for Eureka health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    io.grpc: debug
    net.devh.boot.grpc: DEBUG
    root: INFO
    kz.courier.authservice: DEBUG
    com.netflix.discovery: INFO


## external url paths
app:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080/}
    verify-path: ${API_VERIFY_PATH:api/v1/auth/verify}
