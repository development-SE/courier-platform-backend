# auth-service/src/main/resources/application.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:55433/auth_db
    username: auth_svc
    password: auth
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      
notification-kafka-topic: notification-kafka-topic

server:
  port: 8081

grpc:
  server:
    port: 9091

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  access-expiry-min: 15
  refresh-expiry-min: 10080   # 7 days

