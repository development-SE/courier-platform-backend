server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: ${API_GATEWAY_SERVICE_NAME:api-gateway}

  # Cloud Gateway Configuration
  cloud:
    config:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: true  # Enable automatic route creation from Eureka
          lower-case-service-id: true  # Convert service names to lowercase

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173" # Common Vite default
              - "http://10.202.6.243:8081"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ── Routes ────────────────────────────────────────────────────────────
      routes:
        # user-service  →  GET/POST/PUT/DELETE /api/v1/users/**
        - id: user-service-me
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/me
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=2

        - id: user-service-my-addresses
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/v1/users/me/addresses,/api/v1/users/me/addresses/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=2

        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RoleFilter
              args:
                roles: ADMIN,SUPER_ADMIN
            - name: LoggingFilter
            - StripPrefix=2   # /api/v1/users/... → /users/...

        - id: company-service
          uri: ${COMPANY_SERVICE_URL:lb://company-service}
          predicates:
            - Path=/api/v1/companies/**,/api/v1/employees/**,/api/v1/addresses/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=2

        # ── Logistics Service — Assignments ──────────────────────────────────
        # POST   /api/v1/logistics/assignments
        # GET    /api/v1/logistics/assignments
        # GET    /api/v1/logistics/assignments/{id}
        # PATCH  /api/v1/logistics/assignments/{id}/status
        # GET    /api/v1/logistics/assignments/{id}/history
        - id: courier-service
          uri: ${COURIER_SERVICE_URL:lb://courier-service}
          predicates:
            - Path=/api/v1/couriers/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=2

        - id: logistics-service-assignments
          uri: ${LOGISTICS_SERVICE_URL:lb://logistics-service}
          predicates:
            - Path=/api/v1/logistics/assignments/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=3   # /api/v1/logistics/assignments/... → /assignments/...

        # ── Logistics Service — Courier Locations ─────────────────────────────
        # PUT    /api/v1/logistics/couriers/me/location
        # GET    /api/v1/logistics/couriers/me/location
        # PATCH  /api/v1/logistics/couriers/me/online
        # GET    /api/v1/logistics/couriers/nearby
        - id: logistics-service-couriers
          uri: ${LOGISTICS_SERVICE_URL:lb://logistics-service}
          predicates:
            - Path=/api/v1/logistics/couriers/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=3   # /api/v1/logistics/couriers/... → /couriers/...

        # Notification Service - device token registration and push helpers.
        - id: notification
          uri: ${NOTIFICATION_SERVICE_URL:lb://notification-service}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=3   # /api/v1/notifications/devices -> /devices

      # Default Filters (applied to all routes)
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
        - AddRequestHeader=X-Gateway-Request, GatewayRequest
        - AddResponseHeader=X-Gateway-Response, GatewayResponse
      server:
        webflux:
          filter:
            json-to-grpc:
              enabled: false

  # Redis for Rate Limiting
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
# ── gRPC clients ───────────────────────────────────────────────────────────────

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# gRPC Client Configuration
grpc:
  client:
    auth-service:
      address: ${AUTH_GRPC_ADDRESS:discovery:///auth-service}
      negotiationType: PLAINTEXT

    order-service:
      address: ${ORDER_GRPC_ADDRESS:discovery:///order-service}
      negotiationType: PLAINTEXT
#    courier-service:
#      address: static://localhost:9092
#      negotiationType: PLAINTEXT
#    partner-service:
#      address: static://localhost:9093
#      negotiationType: PLAINTEXT
#    logistics-service:
#      address: static://localhost:9094
#      negotiationType: PLAINTEXT

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days
  allowed-clock-skew-seconds: ${JWT_ALLOWED_CLOCK_SKEW_SECONDS:300}

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
      logisticsServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s   # slightly longer — PostGIS queries can be heavy
  #      orderServiceCircuitBreaker:
  #        slidingWindowSize: 10
  #        permittedNumberOfCallsInHalfOpenState: 3
  #        waitDurationInOpenState: 10s
  #        failureRateThreshold: 50
  #      courierServiceCircuitBreaker:
  #        slidingWindowSize: 10
  #        permittedNumberOfCallsInHalfOpenState: 3
  #        waitDurationInOpenState: 10s
  #        failureRateThreshold: 50
  #      partnerServiceCircuitBreaker:
  #        slidingWindowSize: 10
  #        permittedNumberOfCallsInHalfOpenState: 3
  #        waitDurationInOpenState: 10s
  #        failureRateThreshold: 50

  # Rate Limiter Configuration
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    kz.courier.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
