server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # ── Global CORS ────────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # ── Routes ────────────────────────────────────────────────────────────
      routes:
        # user-service  →  GET/POST/PUT/DELETE /api/v1/users/**
        - id: user-service
          uri: lb://user-service   # load-balanced via Eureka
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthenticationFilter
            - name: RoleFilter
              args:
                roles: ADMIN,SUPER_ADMIN
            - name: LoggingFilter
            - StripPrefix=2   # /api/v1/users/... → /users/...

        - id: company-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/companies/**,/api/v1/employees/**,/api/v1/addresses/**
          filters:
            - name: JwtAuthenticationFilter
            - name: LoggingFilter
            - StripPrefix=2

        # auth-service  →  /api/v1/auth/**
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: LoggingFilter
            - StripPrefix=2

      # ── Default filters (applied to every route) ───────────────────────────
      default-filters:
        - name: Retry
          args:
            retries: 3
            methods: GET
            backoff:
              firstBackoff: 50ms
              maxBackoff: 500ms
              factor: 2
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 10
              burstCapacity: 20
              requestedTokens: 1
        - AddRequestHeader=X-Gateway-Request, GatewayRequest
        - AddResponseHeader=X-Gateway-Response, GatewayResponse

  # ── Redis (rate limiter) ───────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
# ── gRPC clients ───────────────────────────────────────────────────────────────
grpc:
  client:
    auth-service:
      address: discovery:///auth-service   
      negotiationType: PLAINTEXT

# ── JWT (must match auth-service) ─────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  expiration: 86400000
  refresh-expiration: 604800000

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
  ratelimiter:
    instances:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    kz.courier.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    io.grpc: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true