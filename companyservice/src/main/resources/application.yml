server:
  port: ${COMPANY_SERVICE_PORT:8085}

spring:
  application:
    name: company-service

  datasource:
    url: ${COMPANY_DB_URL:jdbc:postgresql://localhost:5433/company_db}
    username: ${COMPANY_DB_USERNAME:company_svc}
    password: ${COMPANY_DB_PASSWORD:company_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false


  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  access-expiry-min: 1440 #later will be15
  refresh-expiry-min: 10080
management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

grpc:
  client:
    auth-service:
      address: ${AUTH_GRPC_ADDRESS:discovery:///auth-service}
      negotiationType: PLAINTEXT

logging:
  level:
    kz.courier.companyservice: DEBUG
