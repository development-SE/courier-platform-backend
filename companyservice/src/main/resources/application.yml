server:
  port: 8085

spring:
  application:
    name: company-service

  datasource:
    url: jdbc:postgresql://localhost:5433/company_db
    username: company_svc
    password: company_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false


  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-at-least-32chars!!}
  access-expiry-min: 1440 #later will be15
  refresh-expiry-min: 10080
management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

grpc:
  client:
    auth-service:
      address: discovery:///auth-service
      negotiationType: PLAINTEXT

logging:
  level:
    kz.courier.companyservice: DEBUG