server:
  port: ${COURIER_SERVICE_PORT:8087}

spring:
  application:
    name: ${COURIER_SERVICE_NAME:courier-service}

  datasource:
    url: ${COURIER_DB_URL:jdbc:postgresql://localhost:5433/courier_db}
    username: ${COURIER_DB_USERNAME:courier_svc}
    password: ${COURIER_DB_PASSWORD:courier_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

grpc:
  client:
    auth-service:
      address: ${AUTH_GRPC_ADDRESS:discovery:///auth-service}
      negotiationType: PLAINTEXT

logging:
  level:
    root: INFO
    kz.courier.courierservice: DEBUG
