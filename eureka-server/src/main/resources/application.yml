server:
  port: 8761  # Default Eureka port

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Don't register Eureka with itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation in dev (allows faster instance removal)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 4000  # Check for expired instances every 4s

# Logging
logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always