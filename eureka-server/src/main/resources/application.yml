server:
  port: ${EUREKA_SERVER_PORT:8761}

spring:
  application:
    name: ${EUREKA_SERVER_NAME:eureka-server}

eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    # Don't register Eureka with itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_SELF_URL:http://${eureka.instance.hostname}:${server.port}/eureka/}
  server:
    # Disable self-preservation in dev (allows faster instance removal)
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 4000  # Check for expired instances every 4s

# Logging
logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
